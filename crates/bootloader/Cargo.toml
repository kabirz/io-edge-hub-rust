[package]
name = "io-edge-hub-boot"
version.workspace = true
edition.workspace = true

[dependencies]
io-edge-hub-proto = { path = "../proto" }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["device"] }
panic-halt = "0.2.0"

embassy-stm32 = { version = "0.6.0", features = ["stm32f407ve"] }
embassy-sync = "0.8.0"
embassy-embedded-hal = "0.6.0"
embassy-boot = { version = "0.7.0", default-features = false }
embedded-storage = "0.3.1"
static_cell = "2"
