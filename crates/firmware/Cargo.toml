[package]
name = "io-edge-hub-fw"
version.workspace = true
edition.workspace = true

[dependencies]
io-edge-hub-proto = { path = "../proto" }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["device"] }
panic-halt = "0.2.0"

embassy-stm32 = { version = "0.6.0", features = ["stm32f407ve", "time-driver-any", "exti"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.0"
embassy-sync = "0.7.0"
embassy-futures = "0.1.1"

embedded-io = "0.6.1"
